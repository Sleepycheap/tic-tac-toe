<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Connect Four HTML Skeleton</title>
    <link href="styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div class="title">
      <span id="text">Let's play tic-tac-toe!</span>
    </div>
    </div>
  <div class="players">
    <div class="p1">
      <form id="playerOneName">
        <label>Player One Name:<input id="playerOneName" name="playerName"</label>
        <input type="submit" value="Submit">
      </form>      
    </div>
    <div class="p2">
      <form id="playerTwoName">
        <label>Player Two Name:<input id="playerTwoName" name="playerName"</label>
        <input type="submit" value="Submit">
      </form>
    </div>
  </div>
  <button class="start" type="button">Start Game</button>
   <div class="container">
     <div class="board"></div>
    </div>
   </div>
    <script src="script.js"></script>
  </body>
</html>
